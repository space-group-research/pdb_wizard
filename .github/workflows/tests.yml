name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install ".[viewer,test]"
      - name: Test
        env:
          PYTHONPATH: src  # test the checkout itself (some tests read build.py and src/)
        # Timing budgets in test_perf.py assume an idle machine, so run it on its own.
        run: |
          python -m pytest -n auto --ignore=tests/test_perf.py
          python -m pytest tests/test_perf.py

  minimum-python:
    # The batch CLI, classic menu and single-file build must still work on 3.7.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.7"
      - name: Install
        run: python -m pip install . pytest
      - name: Build and smoke-test the single file
        env:
          PYTHONPATH: src
        run: |
          python build.py
          python dist/pdb_wizard.py HKUST-1.pdb --info
          python -m pytest tests/test_min_python_compat.py
